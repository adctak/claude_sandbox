<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAFE ZONE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div id="round">ROUND 1</div>
      <div id="lives"></div>
    </div>
    <div class="hud-right">
      <div id="score">0</div>
      <div id="graze">GRAZE 0</div>
    </div>
  </div>

  <div id="startScreen" class="overlay">
    <h1 class="title">SAFE<span>ZONE</span></h1>
    <p class="subtitle">超弾幕の中に、ただ一つだけ弾が通らない場所がある</p>
    <div class="howto">
      <p><b>赤い円</b>が現れてから <b>3秒後</b>、画面を埋め尽くす超弾幕が始まる。</p>
      <p>弾の軌道は赤い円の中を<b>絶対に通らない</b>。円の中に逃げ込めば生き残れる。</p>
      <p>弾幕が止むと円は別の場所へ移動する。また3秒で辿り着け。</p>
      <p><b>矢印 / WASD</b> 移動　<b>SHIFT</b> 低速移動（当たり判定を表示）</p>
      <p class="small">弾の近くをすり抜けると GRAZE で得点。ラウンドが進むほど円は小さく、弾幕は濃くなる。</p>
    </div>
    <p id="bestRecord" class="small"></p>
    <button id="startBtn">CLICK TO START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 class="title over">GAME OVER</h1>
    <p id="resultBody" class="subtitle"></p>
    <button id="restartBtn">RETRY</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
