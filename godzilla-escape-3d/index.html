<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAIJU RUN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div id="lives"></div>
      <div id="distance">0 m</div>
    </div>
    <div id="distTrack"><div id="distFill"></div><div id="distGoalMark"></div></div>
  </div>

  <div id="warnFlash"></div>

  <div id="startScreen" class="overlay">
    <h1 class="title">KAIJU<span>RUN</span></h1>
    <p class="subtitle">怪獣が街を破壊し尽くす。逃げ切れ。</p>
    <div class="howto">
      <p><b>← → / A D</b> — レーン移動</p>
      <p><b>↑ / W / SPACE</b> — ジャンプ</p>
      <p>瓦礫・炎・車の残骸は避けろ（移動でもジャンプでも回避可）。<br>
      怪獣の<b>尻尾払い</b>はジャンプでかわし、<b>踏みつけ</b>からはレーン移動で逃げろ。</p>
    </div>
    <button id="startBtn">CLICK TO START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 class="title over" id="resultTitle">RESULT</h1>
    <p id="resultBody" class="subtitle"></p>
    <button id="restartBtn">RETRY</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
