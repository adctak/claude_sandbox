<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAIJU RUN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div id="lives"></div>
      <div id="distance">0 m</div>
    </div>
    <div id="compassWrap">
      <div id="compassArrow">▲</div>
      <div id="compassLabel">ゴールはこちら</div>
    </div>
  </div>

  <div id="dirWarnFront" class="dirWarn front">⚠ 前方注意</div>
  <div id="dirWarnBack" class="dirWarn back">⚠ 背後注意</div>
  <div id="dirWarnLeft" class="dirWarn left">⚠</div>
  <div id="dirWarnRight" class="dirWarn right">⚠</div>
  <div id="dirWarnAoe" class="dirWarn aoe">⚠ 衝撃波！離れろ or ジャンプ</div>

  <div id="warnFlash"></div>

  <div id="startScreen" class="overlay">
    <h1 class="title">KAIJU<span>RUN</span></h1>
    <p class="subtitle">怪獣が全方位から襲いくる。逃げ惑いながらゲートを目指せ。</p>
    <div class="howto">
      <p><b>W S</b> — 前進・後退　<b>A D</b> — 左右へ移動</p>
      <p><b>← →</b> — 視点を回転　<b>↑ / SPACE</b> — ジャンプ</p>
      <p>攻撃は前後左右、あらゆる方向から来る。警告が出た方向の逆へ動いて距離を取れ。<br>
      全方位の<b>衝撃波</b>だけは、離れるかジャンプでかわせる。</p>
      <p>瓦礫や火災には触れるな。奥に見える<b>光る門</b>まで辿り着けば脱出成功。</p>
    </div>
    <button id="startBtn">CLICK TO START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 class="title over" id="resultTitle">RESULT</h1>
    <p id="resultBody" class="subtitle"></p>
    <button id="restartBtn">RETRY</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
